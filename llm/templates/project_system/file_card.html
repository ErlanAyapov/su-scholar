<a href="{% url 'project_detail_page' active_project.id %}?file={{ document.id }}"
    class="group relative flex items-center rounded-2xl border px-1 py-1 shadow-sm transition {% if active_project_document and active_project_document.id == document.id %}border-slate-300 bg-slate-100 text-slate-900{% else %}border-slate-200 bg-white text-slate-800{% endif %}">
    <!-- Content -->
    {% if document.file_type == 'docx' %}
        <span class="mr-3 inline-flex h-7 w-7 items-center justify-center rounded bg-blue-600 text-xs font-bold text-white" style="font-size: 22px;">W</span> 
    {% elif document.file_type == 'excel' %}
        <span class="mr-3 inline-flex h-7 w-7 items-center justify-center rounded bg-green-600 text-xs font-bold text-white" style="font-size: 22px;">E</span>
    {% elif document.file_type == 'pptx' %}
        <span class="mr-3 inline-flex h-7 w-7 items-center justify-center rounded bg-orange-600 text-xs font-bold text-white" style="font-size: 22px;">P</span>
    {% endif %}

    <div class="min-w-0 flex-1 pr-10">
        <div class="text-sm font-medium truncate">{{ document.title }}</div>
        <div class="mt-1 text-xs {% if active_project_document and active_project_document.id == document.id %}text-slate-600{% else %}text-slate-500{% endif %}">
            {{ document.file_type|upper }} · {{ document.updated_at|date:"d.m.Y H:i" }}
        </div>
    </div>

    <!-- Trash button -->
    <button type="button"
            class="absolute right-3 top-1/2 -translate-y-1/2 hidden group-hover:flex items-center justify-center rounded-lg p-1.5 text-red-500 hover:bg-red-50 hover:text-red-600 z-10">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16">
            <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
            <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
        </svg>
    </button>
</a>

{% extends "admin/change_list.html" %}

{% block extrahead %}
{{ block.super }}
<style>
    .celery-live-panel {
        margin: 0 0 20px;
        border: 1px solid #d6dde5;
        border-radius: 10px;
        background: #fff;
    }

    .celery-live-panel__header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid #e5ebf1;
        background: linear-gradient(90deg, #f8fafc, #eef4f8);
    }

    .celery-live-panel__title {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
    }

    .celery-live-status {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .04em;
        text-transform: uppercase;
        background: #edf2f7;
        color: #334155;
    }

    .celery-live-status[data-state="online"] {
        background: #e7f8ed;
        color: #166534;
    }

    .celery-live-status[data-state="offline"] {
        background: #fff4e5;
        color: #9a3412;
    }

    .celery-live-status[data-state="error"] {
        background: #fdecec;
        color: #b91c1c;
    }

    .celery-live-table-wrapper {
        overflow: auto;
        max-height: 380px;
    }

    .celery-live-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
    }

    .celery-live-table th,
    .celery-live-table td {
        border-bottom: 1px solid #e5ebf1;
        padding: 8px 10px;
        vertical-align: top;
        text-align: left;
    }

    .celery-live-table th {
        position: sticky;
        top: 0;
        background: #f8fafc;
        z-index: 1;
    }

    .celery-row {
        cursor: pointer;
    }

    .celery-badge {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 3px 8px;
        font-weight: 700;
        font-size: 10px;
        letter-spacing: .03em;
        text-transform: uppercase;
    }

    .celery-badge--PENDING { background: #eef2ff; color: #4338ca; }
    .celery-badge--RECEIVED { background: #e0f2fe; color: #0c4a6e; }
    .celery-badge--STARTED { background: #fef3c7; color: #92400e; }
    .celery-badge--PROGRESS { background: #dcfce7; color: #166534; }
    .celery-badge--SUCCESS { background: #d1fae5; color: #065f46; }
    .celery-badge--FAILURE { background: #fee2e2; color: #991b1b; }
    .celery-badge--RETRY { background: #fde68a; color: #92400e; }
    .celery-badge--REVOKED { background: #f1f5f9; color: #0f172a; }
    .celery-badge--SKIPPED { background: #f3f4f6; color: #374151; }

    .celery-task-name {
        max-width: 320px;
        overflow-wrap: anywhere;
    }

    .celery-message {
        max-width: 460px;
        overflow-wrap: anywhere;
    }
</style>
{% endblock %}

{% block content %}
<div class="celery-live-panel">
    <div class="celery-live-panel__header">
        <h2 class="celery-live-panel__title">Live Celery Task Logs</h2>
        <span id="celery-live-status" class="celery-live-status" data-state="offline">offline</span>
    </div>
    <div class="celery-live-table-wrapper">
        <table class="celery-live-table">
            <thead>
                <tr>
                    <th>Task</th>
                    <th>Object</th>
                    <th>Status</th>
                    <th>Message</th>
                    <th>Progress</th>
                    <th>Updated</th>
                </tr>
            </thead>
            <tbody id="celery-live-tbody"></tbody>
        </table>
    </div>
</div>

{{ live_logs|json_script:"celery-live-initial" }}
<script>
    (function () {
        const changeUrlTemplate = "{{ change_url_template|escapejs }}";
        const tableBody = document.getElementById("celery-live-tbody");
        const statusBadge = document.getElementById("celery-live-status");
        const initialRaw = document.getElementById("celery-live-initial");
        const rows = new Map();
        let socket = null;

        function setSocketState(state, label) {
            statusBadge.dataset.state = state;
            statusBadge.textContent = label;
        }

        function formatDate(raw) {
            if (!raw) return "-";
            const dt = new Date(raw);
            if (Number.isNaN(dt.getTime())) return raw;
            return dt.toLocaleString();
        }

        function formatProgress(item) {
            if (item.progress_percent === null || item.progress_percent === undefined) return "-";
            const percent = Number(item.progress_percent);
            if (Number.isNaN(percent)) return "-";
            if (item.progress_current !== null && item.progress_current !== undefined && item.progress_total) {
                return `${item.progress_current}/${item.progress_total} (${percent.toFixed(2)}%)`;
            }
            return `${percent.toFixed(2)}%`;
        }

        function taskObjectLabel(item) {
            if (!item.object_type && !item.object_id) return "-";
            return `${item.object_type || "object"}:${item.object_id || "-"}`;
        }

        function buildRow(item) {
            const tr = document.createElement("tr");
            tr.className = "celery-row";
            tr.dataset.logId = String(item.id);
            tr.innerHTML = `
                <td class="celery-task-name">${item.task_name || "-"}</td>
                <td>${taskObjectLabel(item)}</td>
                <td><span class="celery-badge celery-badge--${item.status}">${item.status}</span></td>
                <td class="celery-message">${item.message || "-"}</td>
                <td>${formatProgress(item)}</td>
                <td>${formatDate(item.updated_at)}</td>
            `;
            tr.addEventListener("click", () => {
                const target = changeUrlTemplate.replace("__id__", String(item.id));
                window.location.href = target;
            });
            return tr;
        }

        function upsertRow(item) {
            const key = String(item.id);
            const existing = rows.get(key);
            const nextNode = buildRow(item);

            if (existing) {
                existing.replaceWith(nextNode);
            } else {
                tableBody.prepend(nextNode);
            }

            rows.set(key, nextNode);
        }

        function initRows() {
            if (!initialRaw) return;
            const data = JSON.parse(initialRaw.textContent || "[]");
            data.forEach((item) => upsertRow(item));
        }

        function startSocket() {
            const protocol = window.location.protocol === "https:" ? "wss" : "ws";
            const wsUrl = `${protocol}://${window.location.host}/ws/celery-task-logs/`;
            socket = new WebSocket(wsUrl);

            socket.onopen = () => setSocketState("online", "online");

            socket.onclose = () => {
                setSocketState("offline", "reconnecting");
                window.setTimeout(startSocket, 2500);
            };

            socket.onerror = () => {
                setSocketState("error", "error");
                if (socket) socket.close();
            };

            socket.onmessage = (event) => {
                let payload = null;
                try {
                    payload = JSON.parse(event.data || "{}");
                } catch (error) {
                    return;
                }
                if (!payload || payload.type !== "task_log.updated" || !payload.data) return;
                upsertRow(payload.data);
            };
        }

        initRows();
        startSocket();
    })();
</script>

{{ block.super }}
{% endblock %}

<form action="{% url 'project_create' %}" method="post" class="space-y-6 rounded-2xl border border-slate-200 bg-white p-5">
    {% csrf_token %}
    <div>
        <label for="project_name" class="block text-sm font-medium text-gray-700">Название проекта</label>
        <div class="mt-1">
            <input
                type="text"
                name="name"
                id="project_name"
                required
                maxlength="300"
                placeholder="Новый проект"
                class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm form-control"
            >
        </div>
    </div>
    <div>
        <label for="project_description" class="block text-sm font-medium text-gray-700">Описание проекта</label>
        <div class="mt-1">
            <textarea
                id="project_description"
                name="description"
                rows="4"
                class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm form-control"
            ></textarea>
        </div>
    </div>
    <div class="flex items-center gap-3">
        <button type="submit" class="inline-flex justify-center rounded-md border border-transparent bg-indigo-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
            Создать проект
        </button>
        <a href="{% url 'project_page' %}" class="inline-flex justify-center rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-50">
            Отмена
        </a>
    </div>
</form>
